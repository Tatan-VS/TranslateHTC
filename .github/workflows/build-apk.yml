name: Compilar APK Traductor Hibrido

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Descargar codigo del repositorio
      uses: actions/checkout@v4

    - name: 2. Instalar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. Configurar Android SDK y Licencias Automaticas
      uses: android-actions/setup-android@v2

    - name: 4. Instalar motor Gradle 8.4
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: 5. Compilar APK
      run: gradle assembleDebug --no-daemon --stacktrace

    - name: 6. Entregar archivo APK listo para descargar
      uses: actions/upload-artifact@v4
      with:
        name: Traductor-HTC-Hibrido-APK
        path: app/build/outputs/apk/debug/app-debug.apk
