name: Compilar APK Traductor Hibrido

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Descargar codigo del repositorio
      uses: actions/checkout@v4

    - name: 2. Instalar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. Instalar motor Gradle 8.4
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: 4. Aceptar licencias en ruta real y Compilar APK
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      run: |
        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
        gradle assembleDebug --no-daemon --stacktrace

    - name: 5. Entregar archivo APK listo para descargar
      uses: actions/upload-artifact@v4
      with:
        name: Traductor-HTC-Hibrido-APK
        path: app/build/outputs/apk/debug/app-debug.apk
